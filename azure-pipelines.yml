trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - '*.md'
      - '**/*.md'

pool:
  vmImage: 'ubuntu-latest'
  demands: []

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildAndTest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
            displayName: 'Set up Python'

          - script: |
              cd app
              python -m pip install -r requirements.txt
            displayName: 'Install dependencies'

          - script: |
              cd app
              pytest test_main.py -v --junitxml=test-results.xml
            displayName: 'Run tests'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: 'app/test-results.xml'
              testRunTitle: 'Pytest results'
            displayName: 'Publish test results'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'app'
              artifact: 'app-package'
            displayName: 'Publish app artifact'


  - stage: DeployDev
    displayName: 'Deploy to Dev'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployDev
        environment: 'dev'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Fetch secret from Key Vault'
                  inputs:
                    azureSubscription: 'sc-dev'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      SECRET=$(az keyvault secret show --vault-name kv-app-dev-rs01 --name AppInsightsKey --query value -o tsv)
                      echo "##vso[task.setvariable variable=AppInsightsKey;issecret=true]$SECRET"

                - script: |
                    echo "Deploying to Dev environment"
                    echo "Using secret (masked): $(AppInsightsKey)"
                    echo "ENVIRONMENT=dev" > $(Pipeline.Workspace)/app-package/.env
                  displayName: 'Deploy app'
  

  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    dependsOn: DeployDev
    condition: succeeded()
    jobs:
      - deployment: DeployStaging
        environment: 'staging'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Fetch secret from Key Vault'
                  inputs:
                    azureSubscription: 'sc-staging'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      SECRET=$(az keyvault secret show --vault-name kv-app-staging --name AppInsightsKey --query value -o tsv)
                      echo "##vso[task.setvariable variable=AppInsightsKey;issecret=true]$SECRET"

                - script: |
                    echo "Deploying to Staging environment"
                    echo "Using secret (masked): $(AppInsightsKey)"
                    echo "ENVIRONMENT=staging" > $(Pipeline.Workspace)/app-package/.env
                  displayName: 'Deploy app'
  

  - stage: DeployProd
    displayName: 'Deploy to Prod'
    dependsOn: DeployStaging
    condition: succeeded()
    jobs:
      - deployment: DeployProd
        environment: 'prod'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Fetch secret from Key Vault'
                  inputs:
                    azureSubscription: 'sc-prod'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      SECRET=$(az keyvault secret show --vault-name kv-app-prod --name AppInsightsKey --query value -o tsv)
                      echo "##vso[task.setvariable variable=AppInsightsKey;issecret=true]$SECRET"

                - script: |
                    echo "Deploying to Prod environment"
                    echo "Using secret (masked): $(AppInsightsKey)"
                    echo "ENVIRONMENT=prod" > $(Pipeline.Workspace)/app-package/.env
                    # Record this deployment as the new 'last known good' marker
                    echo "$(Build.BuildId)" > $(Pipeline.Workspace)/app-package/last-good-build.txt
                  displayName: 'Deploy app'
              on:
                failure:
                  steps:
                    - task: AzureCLI@2
                      displayName: 'Rollback: redeploy last known-good build'
                      inputs:
                        azureSubscription: 'sc-prod'
                        scriptType: bash
                        scriptLocation: inlineScript
                        inlineScript: |
                          echo "Prod deployment failed — rolling back to last known-good build"
                          echo "In a real deployment target, this step would re-run the deploy"
                          echo "commands against the artifact tagged as last-good-build.txt,"
                          echo "rather than leaving Prod on a broken release."
