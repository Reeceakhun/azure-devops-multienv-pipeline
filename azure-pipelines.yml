trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'
  demands: []

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildAndTest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
            displayName: 'Set up Python'

          - script: |
              cd app
              python -m pip install -r requirements.txt
            displayName: 'Install dependencies'

          - script: |
              cd app
              pytest test_main.py -v --junitxml=test-results.xml
            displayName: 'Run tests'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: 'app/test-results.xml'
              testRunTitle: 'Pytest results'
            displayName: 'Publish test results'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: 'app'
              artifact: 'app-package'
            displayName: 'Publish app artifact'


  - stage: DeployDev
    displayName: 'Deploy to Dev'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployDev
        environment: 'dev'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Fetch secret from Key Vault'
                  inputs:
                    azureSubscription: 'sc-dev'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      SECRET=$(az keyvault secret show --vault-name kv-app-dev-rs01 --name AppInsightsKey --query value -o tsv)
                      echo "##vso[task.setvariable variable=AppInsightsKey;issecret=true]$SECRET"

                - script: |
                    echo "Deploying to Dev environment"
                    echo "Using secret (masked): $(AppInsightsKey)"
                    echo "ENVIRONMENT=dev" > $(Pipeline.Workspace)/app-package/.env
                  displayName: 'Deploy app'
